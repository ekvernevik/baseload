# ---------------------------------------------------------------------------
# Nordics config: NO1-NO5 + SE3/SE4 live, FI scaffolded.
#
# Adding a zone is pure config (baseload/zones.py convention): append it to
# `zones`, add its per-stream CSV paths under `inputs`, and (if internally
# connected) its pair(s) to `pairs` and NTC to `ntc`. No code changes required.
# ---------------------------------------------------------------------------
zones: [NO1, NO2, NO3, NO4, NO5, SE3, SE4]
# FI scaffold: add FI to `zones`, its inputs, and SE3-FI to pairs/ntc when data exists.

# 15-min MTU (ENTSO-E default since 1 Oct 2025). Hourly sources are
# forward-filled within their MTU; 15-min sources pass through natively.
resolution: 15min

date_range:
  start: "2025-10-01T00:00:00Z"
  end: "2026-06-30T23:45:00Z"

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  metadata_dir: data/metadata
  artifacts_dir: artifacts

inputs:
  prices:
    NO1: prices/no1_prices.csv
    NO2: prices/no2_prices.csv
    NO3: prices/no3_prices.csv
    NO4: prices/no4_prices.csv
    NO5: prices/no5_prices.csv
    SE3: prices/se3_prices.csv
    SE4: prices/se4_prices.csv
  load:
    NO1: load/no1_load.csv
    NO2: load/no2_load.csv
    NO3: load/no3_load.csv
    NO4: load/no4_load.csv
    NO5: load/no5_load.csv
    SE3: load/se3_load.csv
    SE4: load/se4_load.csv
  actgen:
    NO1: actgen_ppt/no1_actgen_ppt.csv
    NO2: actgen_ppt/no2_actgen_ppt.csv
    NO3: actgen_ppt/no3_actgen_ppt.csv
    NO4: actgen_ppt/no4_actgen_ppt.csv
    NO5: actgen_ppt/no5_actgen_ppt.csv
    SE3: actgen_ppt/se3_actgen_ppt.csv
    SE4: actgen_ppt/se4_actgen_ppt.csv
  transmission:
    NO1: transmission/no1_transmission.csv
    NO2: transmission/no2_transmission.csv
    NO3: transmission/no3_transmission.csv
    NO4: transmission/no4_transmission.csv
    NO5: transmission/no5_transmission.csv
    SE3: transmission/se3_transmission.csv
    SE4: transmission/se4_transmission.csv
  # Reserve markets (ingest_reserves.py). CSV format: MTU, Direction, Price, Volume.
  # mFRR EAM live Mar 2025; PICASSO aFRR live for FI Mar 2025.
  reserves:
    mfrr_eam:
      NO1: reserves/no1_mfrr_eam.csv
    afrr: {}
    fcr_d: {}

pairs:
  - NO1-NO2
  - NO1-NO3
  - NO1-NO5
  - NO2-NO5
  - NO3-NO4
  - NO3-NO5
  - NO1-SE3
  - NO3-SE3
  - NO4-SE4
  - SE3-SE4

# Symmetric transfer capacity per interconnector pair (MW).
# Source: ENTSO-E Winter Outlook / Statnett / Svenska kraftnät (uncalibrated).
# Run calibrate_ntc.py to fit these against observed congestion.
ntc:
  NO1-NO2: 3500
  NO1-NO3: 500
  NO1-NO5: 1000
  NO2-NO5: 600
  NO3-NO4: 700
  NO3-NO5: 1000
  NO1-SE3: 2145
  NO3-SE3: 1000
  NO4-SE4: 300
  SE3-SE4: 5400

thresholds:
  spread_abs: 20
  iqr_yellow: 25
  iqr_red: 15
  tail_yellow: 2.5
  tail_red: 3.5
  congestion_yellow_h: 12
  congestion_red_h: 24
  oversupply_yellow: 0.05
  oversupply_red: 0.10
  foresight_yellow: 20
  foresight_red: 35

regime:
  k: 3
  seed: 42

bess:
  p_mw: 50
  e_mwh: 200
  eta: 0.9
  soc_min: 0.1
  soc_max: 0.9
  throughput_cost: 0.0
  max_cycles_per_day: 2.0   # cycling cap fed to solve_pf (degradation groundwork, #22)

rolling:
  lookahead_h: 24
  step_h: 1
  mode: stochastic
  n_scenarios: 20
  cvar_alpha: 0.95
  cvar_weight: 0.2
  warmup_days: 28
  refit_every_days: 7

forecast:
  quantiles: [0.1, 0.5, 0.9]
  n_scenarios: 50
  backtest_days: 90
  seed: 42

p50p90:
  n_scenarios: 50
  eval_days: 60
  default_realism_gap_pct: 15.0
  seed: 42

calibration:
  sep_threshold_eur: 1.0
  tolerance_pp: 2.0
